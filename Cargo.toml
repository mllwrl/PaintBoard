[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
pb-core = { path = "crates/pb-core" }
pb-geom = { path = "crates/pb-geom" }
pb-render = { path = "crates/pb-render" }
pb-text = { path = "crates/pb-text" }
pb-storage = { path = "crates/pb-storage" }
pb-io = { path = "crates/pb-io" }
pb-tools = { path = "crates/pb-tools" }
pb-platform = { path = "crates/pb-platform" }
pb-sync = { path = "crates/pb-sync" }

kurbo = "0.13"
vello = "0.11"
winit = "0.30"
log = "0.4"
pollster = "1"
env_logger = "0.11"
wasm-bindgen-futures = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies (wgpu, vello, ...) are much faster at runtime with optimizations,
# and they rarely change, so this costs little compile time.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
