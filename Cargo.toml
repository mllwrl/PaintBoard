[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
pb-core = { path = "crates/pb-core" }
pb-geom = { path = "crates/pb-geom" }
pb-render = { path = "crates/pb-render" }
pb-text = { path = "crates/pb-text" }
pb-storage = { path = "crates/pb-storage" }
pb-io = { path = "crates/pb-io" }
pb-tools = { path = "crates/pb-tools" }
pb-platform = { path = "crates/pb-platform" }
pb-sync = { path = "crates/pb-sync" }
pb-plugin = { path = "crates/pb-plugin" }

kurbo = "0.13"
rstar = "0.12"
loro = "1.16"
# Loro's JSON form of changes, which the server checks for people who may only comment.
serde_json = "1"
# Pure Rust build: no C or assembly to compile, and it works on wasm32.
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
vello = "0.11"
winit = "0.30"
log = "0.4"
pollster = "1"
env_logger = "0.11"
wasm-bindgen-futures = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
rfd = "0.17"
egui = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false }
egui-wgpu = { version = "0.37", default-features = false }
web-time = "1.1"
parley = { version = "0.12", default-features = false, features = ["std"] }
windows = "0.62"
# Formats that can be placed on a board; see pb_io::image::EXTENSIONS.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Property tests (dev only).
proptest = "1.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies (wgpu, vello, ...) are much faster at runtime with optimizations,
# and they rarely change, so this costs little compile time.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
