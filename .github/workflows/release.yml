name: Release

# A tag like v0.2.0 builds the Windows installer, the Linux AppImage and tarball and the
# macOS disk image, and attaches them to a GitHub Release of that tag (Releases page).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup and cargo-about
        run: |
          choco install innosetup --no-progress -y
          cargo install cargo-about --locked --features cli
      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/installer/*-setup.exe

  linux:
    # The oldest supported runner: the program needs this glibc or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-about --locked --features cli
      - name: Build the AppImage and tarball
        run: sh packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/linux/PaintBoard-*.AppImage
            target/linux/*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-about --locked --features cli
      - name: Build the disk image
        run: sh packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/*.dmg

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Run by hand on a branch, the files stay in the workflow run's artifacts.
          if [ "$REF_TYPE" != "tag" ]; then ls -l dist; exit 0; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "PaintBoard $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
