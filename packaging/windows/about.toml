# cargo-about: which licenses may appear in THIRD-PARTY.txt. Mirrors deny.toml.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    # Allowed per crate in deny.toml (im, sized-chunks, bitmaps; webpki-root-certs).
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# Only what is built into the Windows app.
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Our own crates are unpublished and unlicensed until the project license is chosen.
private = { ignore = true }
