[package]
name = "pb-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pb-core.workspace = true
pb-geom.workspace = true
pb-platform.workspace = true
image.workspace = true
# Rendering PDF pages to pictures.
hayro = { version = "0.8", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
# Drawing SVG files into pictures.
resvg = { version = "0.48", default-features = false, features = ["svgz", "text", "system-fonts", "raster-images"] }
