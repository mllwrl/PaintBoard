[package]
name = "pb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Server for sharing PaintBoard boards"

[[bin]]
name = "paintboard-server"
path = "src/main.rs"

[lints]
workspace = true

# A server only: nothing to build for the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pb-core.workspace = true
pb-sync.workspace = true
blake3.workspace = true
log.workspace = true
env_logger.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs"] }
# SQLite built in, so the server is one file to copy.
rusqlite = { version = "0.40", features = ["bundled"] }
getrandom = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-tungstenite = "0.29"
kurbo.workspace = true
futures-util = "0.3"
# The desktop app's own WebSocket and requests, against the real server.
pb-platform.workspace = true
