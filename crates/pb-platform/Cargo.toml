[package]
name = "pb-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log.workspace = true
web-time.workspace = true
# The language the system is set to, for the UI's.
sys-locale = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
# image-data: pictures on the clipboard (screenshots, images copied in a browser).
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Fetching web pages for link previews, over the system's TLS and certificates.
ureq = { version = "3.4", default-features = false, features = ["native-tls", "gzip"] }
# Shared boards: the server's WebSocket, over the system's TLS like ureq.
tungstenite = { version = "0.29", features = ["native-tls"] }
# Microphone and speakers for talktracks (WASAPI on Windows).
cpal = "0.18"

# Handwriting recognition through Windows Ink (part of the OS, works offline).
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Foundation",
    "Foundation_Numerics",
    "UI_Input_Inking",
    "Win32_System_WinRT",
    # Opening links in the browser.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies]
windows-collections = "0.3"
windows-numerics = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures.workspace = true
# The origin private file system (OPFS), where the web version keeps its files, and the
# browser's file picker, downloads and dialogs.
web-sys = { version = "0.3", features = [
    # Talktrack sound: the microphone and playing back.
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioProcessingEvent",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "Navigator",
    "ScriptProcessorNode",
    "Blob",
    "BinaryType",
    "BlobPropertyBag",
    "CloseEvent",
    "Headers",
    "Location",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "WebSocket",
    "Clipboard",
    "ClipboardItem",
    "DataTransfer",
    "Document",
    "DragEvent",
    "EventTarget",
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemWritableFileStream",
    "FileList",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Navigator",
    "StorageManager",
    "Url",
    "Window",
] }
