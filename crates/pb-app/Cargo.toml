[package]
name = "pb-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "paintboard"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pb-core.workspace = true
pb-geom.workspace = true
pb-render.workspace = true
pb-text.workspace = true
pb-storage.workspace = true
pb-io.workspace = true
pb-tools.workspace = true
pb-platform.workspace = true
pb-sync.workspace = true
winit.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The system clipboard for text fields and Wayland/X11 support; not available on the web.
egui-winit = { workspace = true, features = ["clipboard", "wayland", "x11"] }
pollster.workspace = true
env_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
console_log.workspace = true
console_error_panic_hook.workspace = true
