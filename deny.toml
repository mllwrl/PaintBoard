# cargo-deny: run `cargo deny check` before adding dependencies.
# The project may be released commercially, so only permissive licenses are allowed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained. It only comes in via winit -> sctk-adwaita (Wayland window
    # decorations on Linux) and has no safe replacement yet. Revisit when bumping winit.
    { id = "RUSTSEC-2026-0192", reason = "Linux-only transitive dep of winit, no alternative yet" },
    # Unmaintained (not vulnerable) crates pulled in by loro. Revisit when bumping loro.
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via loro -> postcard -> heapless" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps via loro -> im" },
    { id = "RUSTSEC-2026-0248", reason = "im via loro" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks via loro -> im" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list covers licenses we accept in the future too, not only current ones.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    # Public-domain-like: not even a notice to keep (quoted_printable, via lettre).
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
# MPL-2.0 is file-level copyleft: fine to ship unmodified in a closed-source app, as long as
# the notices are kept and these crates' sources stay available. Allowed per crate, not globally.
exceptions = [
    { allow = ["MPL-2.0"], crate = "im" },
    { allow = ["MPL-2.0"], crate = "sized-chunks" },
    { allow = ["MPL-2.0"], crate = "bitmaps" },
    # Mozilla's root certificate list as data, under a permissive data license (keep the
    # notice). Compiled in by ureq's native-tls feature; certificates come from the system.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]
# Our own crates are unpublished and unlicensed until the project license is chosen.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
